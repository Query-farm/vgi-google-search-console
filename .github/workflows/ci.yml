name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # pyproject deliberately carries no `[tool.uv.sources]`, so a fresh clone
  # resolves from PyPI. This pins that shut: if a local path source is ever
  # added, CI still proves the *published* dependencies are sufficient.
  UV_NO_SOURCES: "1"
  # The SQL test runner; matches HAYBARN_VERSION in the Makefile.
  HAYBARN_VERSION: "2.0.1rc3"

jobs:
  oauth:
    name: Shared OAuth source parity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: Query-farm/vgi-google-analytics
          ref: main
          path: .canonical-oauth
      - run: python3 .canonical-oauth/scripts/sync_oauth.py --check --target .

  check:
    name: Lint, types, tests (incl. offline SQL end-to-end)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --no-sources --locked
      - name: Ruff (lint)
        run: uv run --no-sources ruff check .
      - name: Ruff (format)
        run: uv run --no-sources ruff format --check .
      - name: Mypy (strict)
        run: uv run --no-sources mypy
      # Includes tests/test_end_to_end.py: the real worker attached from DuckDB
      # (Haybarn ships the vgi extension) against tests/fake_gsc.py over a real
      # socket. No credentials and no Google traffic, so it runs on every push.
      - name: Tests
        run: uv run --no-sources pytest -q
      - name: Entry points start without the dev checkout's environment
        run: |
          uv run --no-project gsc_worker.py --help > /dev/null
          uv run --no-project serve.py --help > /dev/null


  integration:
    # The SQL suite (test/sql/*.test) through DuckDB's sqllogictest runner and the
    # signed community vgi extension, against the offline fake (tests/fake_gsc.py via
    # test/mock_api/server.py): no credentials and no Google traffic.
    name: SQL tests (${{ matrix.os }}, ${{ matrix.transport }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        transport: [stdio, launch, http]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Build the worker
        run: uv sync --no-sources --locked
      - name: Install the SQL test runner
        run: |
          uv venv .tools
          uv pip install -p .tools "haybarn-unittest==${{ env.HAYBARN_VERSION }}"
      - name: Run test/sql over ${{ matrix.transport }}
        run: |
          WORKER="$PWD/.venv/bin/vgi-google-search-console" \
          HAYBARN_UNITTEST="$PWD/.tools/bin/haybarn-unittest" \
          PYTHON="$PWD/.venv/bin/python" \
          TRANSPORT=${{ matrix.transport }} ci/run-integration.sh

  catalog:
    name: Catalog metadata (vgi-lint, structural)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --no-sources --locked
      # Structural tier only: it inspects the catalog without running a query,
      # so no credentials are needed. The behavioural tier executes every
      # example against real Search Console and runs in live.yml.
      # Use the project's engine so the client and worker wire versions match.
      - name: vgi-lint (structural)
        run: >
          uv run --no-sources --prerelease=allow --with 'vgi-lint-check>=2.9.0,<3' vgi-lint lint "uv run --no-sources gsc_worker.py"
          --no-execute --no-check-links --audit-waivers --fail-on warning
